name: Dependency refresh October 26
on:
  pull_request:
permissions:
  contents: read
jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.pull_request.head.sha }}
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      - uses: Swatinem/rust-cache@v2
      - name: Resolve and validate
        run: |
          cargo update
          python3 - <<'PY'
          import json, urllib.request, tomllib
          m=tomllib.load(open("Cargo.toml","rb"))
          for section in ("dependencies","dev-dependencies","build-dependencies"):
           for name,spec in m.get(section,{}).items():
            package=spec.get("package",name) if isinstance(spec,dict) else name
            data=json.load(urllib.request.urlopen("https://crates.io/api/v1/crates/"+package))
            print("DIRECT",package,str(spec),data["crate"]["max_stable_version"])
          
          PY
          cargo test --locked
          cargo fmt --check
          cargo clippy --all-targets --locked -- -D warnings
          cargo build --locked --release
          cargo install cargo-audit --locked
          cargo audit

      - name: Export canonical resolution
        if: always()
        run: |
          sha256sum Cargo.toml Cargo.lock
          echo LOCKFILE_BASE64_BEGIN
          base64 -w 0 Cargo.lock
          echo
          echo LOCKFILE_BASE64_END
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: canonical-dependencies
          path: |
            Cargo.toml
            Cargo.lock
